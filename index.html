<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peninsula Hotel Da Nang — Virtual Concierge</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A96E;
    --gold-light: #E8D5B0;
    --gold-dark: #8B6914;
    --cream: #FAF7F2;
    --dark: #1A1714;
    --dark-mid: #2D2821;
    --charcoal: #3D3530;
    --muted: #8A7F77;
    --bubble-guest: #2D2821;
    --bubble-ai: #FFF9F0;
    --border: rgba(201,169,110,0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--cream); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: var(--dark); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 72px; flex-shrink: 0; position: relative; }
  header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .hotel-brand { display: flex; align-items: center; gap: 14px; }
  .hotel-logo { width: 42px; height: 42px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--gold); letter-spacing: 1px; position: relative; }
  .hotel-logo::before, .hotel-logo::after { content: ''; position: absolute; width: 6px; height: 6px; border: 1px solid var(--gold); background: var(--dark); }
  .hotel-logo::before { top: -3px; left: -3px; }
  .hotel-logo::after { bottom: -3px; right: -3px; }
  .hotel-name { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; color: var(--cream); }
  .hotel-tagline { font-size: 0.65rem; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; font-weight: 300; }
  .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4CAF82; box-shadow: 0 0 8px #4CAF82; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .quick-topics { background: var(--dark-mid); border-bottom: 1px solid var(--border); padding: 10px 2rem; display: flex; gap: 8px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
  .quick-topics::-webkit-scrollbar { display: none; }
  .topic-chip { flex-shrink: 0; padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.72rem; color: var(--gold-light); cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px; white-space: nowrap; background: transparent; }
  .topic-chip:hover { border-color: var(--gold); background: rgba(201,169,110,0.08); color: var(--gold); }
  .chat-area { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; scroll-behavior: smooth; }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .welcome-msg { text-align: center; padding: 2rem 1rem; animation: fadeUp 0.6s ease; }
  .welcome-msg .ornament { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; color: var(--gold); letter-spacing: 4px; opacity: 0.4; line-height: 1; }
  .welcome-msg h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 300; color: var(--cream); margin: 0.5rem 0 0.75rem; letter-spacing: 1px; }
  .welcome-msg p { font-size: 0.85rem; color: var(--muted); line-height: 1.7; max-width: 400px; margin: 0 auto; }
  .message { display: flex; gap: 12px; animation: fadeUp 0.3s ease; max-width: 800px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .message.guest { flex-direction: row-reverse; align-self: flex-end; }
  .message.ai { align-self: flex-start; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 500; }
  .avatar.ai-avatar { background: linear-gradient(135deg, var(--gold-dark), var(--gold)); color: var(--dark); font-family: 'Cormorant Garamond', serif; font-size: 1rem; border: 1px solid var(--gold); }
  .avatar.guest-avatar { background: var(--charcoal); color: var(--gold-light); border: 1px solid rgba(201,169,110,0.3); font-size: 0.9rem; }
  .bubble { max-width: 520px; padding: 14px 18px; border-radius: 4px; font-size: 0.88rem; line-height: 1.75; }
  .message.guest .bubble { background: var(--bubble-guest); border: 1px solid rgba(201,169,110,0.15); border-radius: 4px 0 4px 4px; color: var(--cream); }
  .message.ai .bubble { background: var(--bubble-ai); border: 1px solid var(--gold-light); border-radius: 0 4px 4px 4px; color: var(--dark); position: relative; }
  .message.ai .bubble::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); }
  .meta { font-size: 0.65rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.5px; }
  .message.guest .meta { text-align: right; }
  .typing-indicator { display: flex; gap: 12px; align-items: center; animation: fadeUp 0.3s ease; }
  .typing-dots { background: var(--bubble-ai); border: 1px solid var(--gold-light); padding: 14px 18px; border-radius: 0 4px 4px 4px; display: flex; gap: 5px; align-items: center; }
  .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: typing 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }
  .input-area { background: var(--dark-mid); border-top: 1px solid var(--border); padding: 1.25rem 2rem; flex-shrink: 0; }
  .input-wrapper { display: flex; gap: 12px; align-items: flex-end; max-width: 800px; margin: 0 auto; background: var(--dark); border: 1px solid var(--border); border-radius: 4px; padding: 10px 14px; transition: border-color 0.2s; }
  .input-wrapper:focus-within { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(201,169,110,0.15); }
  #userInput { flex: 1; background: transparent; border: none; outline: none; color: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 0.88rem; line-height: 1.5; resize: none; max-height: 120px; min-height: 24px; scrollbar-width: none; }
  #userInput::placeholder { color: var(--muted); }
  #sendBtn { width: 36px; height: 36px; background: var(--gold); border: none; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; color: var(--dark); }
  #sendBtn:hover { background: var(--gold-light); transform: scale(1.05); }
  #sendBtn:active { transform: scale(0.95); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .input-hint { text-align: center; font-size: 0.65rem; color: var(--muted); margin-top: 8px; letter-spacing: 0.5px; }
  .day-divider { text-align: center; position: relative; margin: 0.5rem 0; }
  .day-divider span { font-size: 0.65rem; color: var(--muted); background: var(--dark); padding: 0 12px; letter-spacing: 2px; text-transform: uppercase; position: relative; z-index: 1; }
  .day-divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); }
  .bubble ul, .bubble ol { padding-left: 1.2rem; margin: 6px 0; }
  .bubble li { margin: 3px 0; }
  .bubble strong { color: var(--gold-dark); font-weight: 500; }
  .bubble em { font-style: italic; }
  .bubble p { margin: 4px 0; }
</style>
</head>
<body>

<header>
  <div class="hotel-brand">
    <div class="hotel-logo">PH</div>
    <div>
      <div class="hotel-name">Peninsula Hotel</div>
      <div class="hotel-tagline">Virtual Concierge · 24/7</div>
    </div>
  </div>
  <div class="status-indicator">
    <div class="status-dot"></div>
    Online
  </div>
</header>

<div class="quick-topics">
  <button class="topic-chip" onclick="sendQuick('What are the check-in and check-out times?')">🕐 Check-in/out</button>
  <button class="topic-chip" onclick="sendQuick('What facilities does the hotel have?')">🏊 Facilities</button>
  <button class="topic-chip" onclick="sendQuick('Tell me about The Veranda restaurant')">🍽️ Restaurant</button>
  <button class="topic-chip" onclick="sendQuick('Do you have airport transfer service?')">✈️ Airport Transfer</button>
  <button class="topic-chip" onclick="sendQuick('What attractions are near the hotel?')">🗺️ Explore</button>
  <button class="topic-chip" onclick="sendQuick('I need extra towels and pillows')">🛎️ Room Request</button>
  <button class="topic-chip" onclick="sendQuick('What is the WiFi password?')">📶 WiFi</button>
  <button class="topic-chip" onclick="sendQuick('Tell me about Peninsula Spa')">💆 Spa</button>
  <button class="topic-chip" onclick="sendQuick('Tell me about Royale Lounge on floor 28')">🌙 Royale Lounge</button>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome-msg">
    <div class="ornament">✦</div>
    <h2>Welcome, Valued Guest</h2>
    <p>I am the virtual concierge of Peninsula Hotel Da Nang. I am here to assist you 24/7 in any language. How may I make your stay more memorable?</p>
  </div>
  <div class="day-divider"><span>Today</span></div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput" placeholder="Ask me anything…" rows="1"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
</div>

<script>
const SYSTEM_PROMPT = `CRITICAL LANGUAGE RULE: Always reply in the EXACT same language the guest used. Vietnamese → Vietnamese. English → English. Russian → Russian. Chinese → Chinese. Japanese → Japanese. Korean → Korean. French → French. Arabic → Arabic. Auto-detect and match perfectly.

You are the virtual concierge of Peninsula Hotel Da Nang — a luxury 5-star hotel.

HOTEL INFORMATION:
- Name: Peninsula Hotel Da Nang
- Address: 84 Vo Nguyen Giap Street, Son Tra Ward, Da Nang City, Vietnam
- Phone: +84 (0) 2363 816 666
- Email: info@peninsulahotel.vn
- Website: www.peninsulahotel.vn
- Total: 259 rooms with ocean, city, and Son Tra Peninsula views
- Room types: Deluxe City View, Deluxe Ocean Queen/Twin, Grand Ocean Queen, Executive Ocean Twin, Grand Executive Ocean Queen/Twin, Marco Polo Suite, Elizabeth Suite, Peninsula Suite

CHECK-IN / CHECK-OUT:
- Check-in: 14:00 | Check-out: 12:00
- Early check-in and late check-out subject to availability

OUTLETS & OPENING HOURS:
1. CLASSICO BAR — 1st Floor | 8:00 AM – 10:00 PM
2. THE VERANDA (Restaurant) — 3rd Floor | 6:00 AM – 10:00 PM
3. PENINSULA SPA — 4th Floor | 8:00 AM – 10:00 PM (massage, facial, body treatments)
4. CAMELLIA MEETING (Meeting rooms / Conference) — 4th Floor | By appointment
5. SALSA COFFEE & BAR — 27th Floor | 8:00 AM – 12:00 PM (midnight)
6. KIDS' ZONE — 27th Floor | 8:00 AM – 9:00 PM
7. FITNESS27 (Gym) — 27th Floor | 6:00 AM – 8:00 PM
8. INFINITY POOL — 27th Floor | 6:00 AM – 9:00 PM
9. ROYALE LOUNGE (Halal-certified) — 28th Floor | 8:00 AM – 12:00 AM (midnight)
10. ROOM SERVICE — 11:00 AM – 6:00 AM

NEARBY ATTRACTIONS:
- My Khe Beach: Steps from the hotel (one of the world's most beautiful beaches)
- Son Tra Peninsula & Linh Ung Pagoda: 10-15 minutes
- Hoi An Ancient Town: ~25-30 minutes
- Ba Na Hills / Golden Bridge: ~45 minutes
- Marble Mountains (Ngu Hanh Son): ~15 minutes
- Da Nang Dragon Bridge: ~10 minutes

TRANSPORT:
- Airport transfer: contact front desk for arrangements
- Taxi and Grab available
- Bicycle and motorbike rental: ask concierge

BOOKING:
- Book direct: book-directonline.com/properties/peninsulahoteldirect
- Modify/Cancel: contact front desk or website

STYLE:
- Polite, warm, professional like a 5-star concierge
- Concise and helpful
- For unavailable info, refer guest to front desk at +84 (0) 2363 816 666
- Use light emojis when appropriate
- Highlight unique features: beachfront location, Halal dining at Royale Lounge, rooftop pool & bar on 27th floor, panoramic views from 28th floor`;

let conversationHistory = [];
let isLoading = false;

const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
});

userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function getTime() {
  return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const isAI = role === 'ai';
  div.innerHTML = `
    <div class="avatar ${isAI ? 'ai-avatar' : 'guest-avatar'}">${isAI ? '✦' : '👤'}</div>
    <div>
      <div class="bubble">${formatText(text)}</div>
      <div class="meta">${isAI ? 'Peninsula Hotel · ' : ''}${getTime()}</div>
    </div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="avatar ai-avatar">✦</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  userInput.value = '';
  userInput.style.height = 'auto';

  const welcome = document.querySelector('.welcome-msg');
  if (welcome) welcome.remove();

  appendMessage('guest', text);
  conversationHistory.push({ role: 'user', content: text });
  showTyping();

  try {
    const response = await fetch('https://peninsula-xi.vercel.app/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    hideTyping();

    const reply = data.content?.[0]?.text || 'Sorry, please contact our front desk for assistance.';
    conversationHistory.push({ role: 'assistant', content: reply });
    appendMessage('ai', reply);

  } catch (err) {
    hideTyping();
    appendMessage('ai', 'System error. Please contact our front desk at +84 (0) 2363 816 666.');
  }

  isLoading = false;
  sendBtn.disabled = false;
  userInput.focus();
}

function sendQuick(msg) {
  userInput.value = msg;
  sendMessage();
}
</script>
</body>
</html>
